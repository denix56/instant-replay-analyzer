[package]
name = "instant-replay-analyzer-native-ui"
version = "0.1.0"
description = "Native UI for local-first semantic gameplay clip search"
authors = ["Instant Replay Analyzer"]
license = "Apache-2.0"
repository = "https://github.com/denix56/instant-replay-analyzer"
edition = "2021"

[lib]
name = "instant_replay_analyzer_native_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
